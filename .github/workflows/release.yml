name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build web bundles
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Assemble release APK (debug-signed for installability)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Get version from gradle
        id: version
        run: |
          VER=$(grep versionName app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Rename and hash APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             andagent-v${{ steps.version.outputs.version }}.apk
          sha256sum andagent-v${{ steps.version.outputs.version }}.apk \
             > andagent-v${{ steps.version.outputs.version }}.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            andagent-v*.apk
            andagent-v*.apk.sha256
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.sha256
