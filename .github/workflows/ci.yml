name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (vitest + tsc + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        # npm 10.8.2 "Exit handler never called" bug on this dep tree — pnpm only.
        run: pnpm install --frozen-lockfile --no-audit --no-fund
      - name: Unit tests
        working-directory: web
        run: pnpm test
      - name: Build web bundles (web + dbgui)
        working-directory: web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run build
      - name: Upload web assets
        uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: app/src/main/assets/
          retention-days: 3

  android:
    name: Android (assembleDebug)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Download web assets from previous job
        uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: app/src/main/assets/
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: andagent-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
